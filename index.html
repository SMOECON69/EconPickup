<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECON PICKUP 2026 — ระบบจองคิวรับของ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1D1820;
    --ink-soft:#2B2530;
    --ink-softer:#3B3340;
    --paper:#FFFFFF;
    --paper-dim:#FBE1EE;
    --paper-line:#F3BFDA;
    --amber:#FF3E93;
    --amber-deep:#D81C71;
    --rose:#E2496B;
    --ok:#4FAE86;
    --text-onink:#FAF3F6;
    --text-muted:#B69AA9;
    --text-onpaper:#1A1418;
    --text-onpaper-muted:#7A6672;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--text-onink);
    font-family:'Kanit',sans-serif;
    min-height:100vh;
  }
  .display{font-family:'Kanit',sans-serif; font-weight:700;}
  .mono{font-family:'Space Mono',monospace;}

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 28px;
    border-bottom:1px solid rgba(250,243,246,0.1);
    flex-wrap:wrap;
    gap:14px;
  }
  .wordmark{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .wordmark img{
    height:42px;
    width:42px;
    object-fit:cover;
    border-radius:50%;
    border:1.5px solid rgba(255,62,147,0.45);
    background:#1D1820;
    filter:drop-shadow(0 0 6px rgba(255,62,147,0.25));
  }
  .wordmark .txt .display{
    font-size:22px;
    color:var(--amber);
    letter-spacing:0.5px;
    display:block;
    line-height:1.1;
  }
  .wordmark .txt .sub{
    font-size:11px;
    color:var(--text-muted);
    letter-spacing:2px;
    text-transform:uppercase;
  }
  .toggle{
    display:flex;
    background:rgba(250,243,246,0.08);
    border-radius:999px;
    padding:4px;
    gap:4px;
  }
  .toggle button{
    border:none;
    background:transparent;
    color:var(--text-muted);
    padding:9px 20px;
    border-radius:999px;
    font-family:'Kanit',sans-serif;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:all .2s ease;
  }
  .toggle button.active{
    background:var(--amber);
    color:#fff;
  }
  .toggle-sm button{
    padding:6px 14px;
    font-size:12.5px;
  }

  .stage{
    padding:28px 20px 60px;
    max-width:1180px;
    margin:0 auto;
  }

  /* ---------- Hero banner ---------- */
  .hero-banner{
    max-width:460px;
    margin:0 auto 24px;
    border-radius:10px;
    overflow:hidden;
    position:relative;
    box-shadow:0 18px 40px rgba(255,62,147,0.12);
    border:1px solid rgba(255,62,147,0.25);
  }
  .hero-banner img{
    width:100%;
    display:block;
    aspect-ratio:12/5;
    object-fit:cover;
  }

  /* ---------- Customer wizard ---------- */
  .wizard-wrap{
    max-width:460px;
    margin:0 auto;
  }
  .steps-track{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-bottom:28px;
  }
  .step-dot{
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--text-muted);
    font-size:12px;
  }
  .step-dot .circle{
    width:22px;height:22px;border-radius:50%;
    border:1.5px solid var(--text-muted);
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Mono',monospace;
    font-size:11px;
  }
  .step-dot.active{color:var(--amber);}
  .step-dot.active .circle{border-color:var(--amber);background:rgba(255,62,147,0.15);}
  .step-dot.done .circle{border-color:var(--ok);background:var(--ok);color:#fff;}
  .step-line{width:24px;height:1px;background:rgba(250,243,246,0.2);}

  .card-paper{
    background:var(--paper);
    color:var(--text-onpaper);
    border-radius:8px;
    padding:32px 28px;
    box-shadow:0 20px 50px rgba(0,0,0,0.45);
    border-top:3px solid var(--amber);
  }
  .card-paper h2{
    font-family:'Kanit',sans-serif;
    font-weight:700;
    font-size:21px;
    margin:0 0 6px;
    color:var(--ink);
  }
  .card-paper .hint{
    font-size:13px;
    color:var(--text-onpaper-muted);
    margin:0 0 22px;
    line-height:1.6;
  }
  .form-warning{
    font-size:12.5px;
    color:#8a4a12;
    background:#fff2e0;
    border:1px solid #f2cc98;
    border-left:3px solid #e0a458;
    padding:10px 13px;
    border-radius:5px;
    line-height:1.6;
    margin:14px 0 22px;
  }
  label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin-bottom:6px;
    color:#5c1738;
  }
  .field{margin-bottom:16px;}
  input[type=text], input[type=tel], input[type=password], input[type=email]{
    width:100%;
    padding:11px 13px;
    border:1.5px solid var(--paper-line);
    border-radius:5px;
    background:#fff;
    font-family:'Kanit',sans-serif;
    font-size:15px;
    color:var(--text-onpaper);
  }
  input:focus{outline:2px solid var(--amber-deep);outline-offset:1px;}

  .btn{
    border:none;
    border-radius:5px;
    padding:12px 22px;
    font-family:'Kanit',sans-serif;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    transition:transform .1s ease, opacity .2s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--ink);color:var(--text-onink);}
  .btn-primary:disabled{opacity:0.35;cursor:not-allowed;}
  .btn-ghost{background:transparent;color:#5c1738;text-decoration:underline;}
  .btn-amber{background:var(--amber);color:#fff;}
  .btn-row{display:flex;justify-content:space-between;align-items:center;margin-top:22px;}

  .date-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:6px;}
  .date-opt{
    border:1.5px solid var(--paper-line);
    background:#fff;
    border-radius:6px;
    padding:14px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .date-opt:hover{border-color:var(--amber-deep);}
  .date-opt.selected{border-color:var(--amber-deep); background:var(--paper-dim);}
  .date-opt.closed{
    opacity:0.55;
    cursor:not-allowed;
    background:#f5f5f5;
  }
  .date-opt.closed:hover{ border-color:var(--paper-line); }
  .date-opt .d-main{font-weight:600;font-size:15px;}
  .date-opt .d-sub{font-size:12px;color:var(--text-onpaper-muted);}
  .slot-badge{
    font-family:'Space Mono',monospace;
    font-size:12px;
    padding:4px 9px;
    border-radius:999px;
    background:var(--paper-dim);
    color:var(--amber-deep);
  }
  .slot-badge.low{background:rgba(226,73,107,0.18);color:var(--rose);}
  .slot-badge.closed-badge{background:#e2e2e2; color:#8a8a8a;}

  /* Ticket stub */
  .ticket{
    background:#fff;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,0.45);
  }
  .ticket-top{
    background:var(--ink);
    color:var(--text-onink);
    padding:20px 26px 20px;
    text-align:center;
    position:relative;
  }
  .ticket-top .logo-watermark{
    position:absolute;
    top:12px;left:14px;
    width:28px;height:28px;
    object-fit:cover;
    border-radius:50%;
    border:1.5px solid rgba(255,62,147,0.5);
    opacity:0.9;
  }
  .ticket-top .label{
    font-size:11px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--text-muted);
    margin-bottom:8px;
  }
  .ticket-top .queue-no{
    font-family:'Space Mono',monospace;
    font-size:56px;
    font-weight:700;
    color:var(--amber);
    line-height:1;
  }
  .ticket-now-serving{
    margin-top:12px;
    font-size:13px;
    color:var(--text-muted);
    background:rgba(250,243,246,0.08);
    display:inline-block;
    padding:6px 14px;
    border-radius:999px;
  }
  .ticket-now-serving.my-turn{
    background:var(--ok);
    color:#fff;
    font-weight:700;
    animation: pulse-turn 1s ease infinite alternate;
  }
  @keyframes pulse-turn{
    from{ opacity:1; }
    to{ opacity:0.7; }
  }
  .ticket-toggle-btn{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:var(--amber-deep);
    border:none;
    border-radius:999px;
    padding:10px 16px;
    margin-top:14px;
    font-family:'Kanit',sans-serif;
    font-size:14px;
    font-weight:600;
    color:#fff;
    cursor:pointer;
  }
  .ticket-toggle-btn.active{ background:var(--amber); }
  .btn-ghost-danger{
    background:rgba(226,73,107,0.12);
    color:var(--rose);
    border:1.5px solid rgba(226,73,107,0.35);
  }
  .perforation{
    position:relative;
    height:0;
    border-top:2px dashed var(--paper-line);
    margin:0 18px;
  }
  .perforation::before, .perforation::after{
    content:'';
    position:absolute;
    top:-9px;
    width:18px;height:18px;
    background:var(--ink);
    border-radius:50%;
  }
  .perforation::before{left:-27px;}
  .perforation::after{right:-27px;}
  .ticket-body{padding:22px 26px 26px;color:var(--text-onpaper);}
  .ticket-row{
    display:flex;
    justify-content:space-between;
    padding:9px 0;
    border-bottom:1px solid var(--paper-dim);
    font-size:14px;
  }
  .ticket-row:last-child{border-bottom:none;}
  .ticket-row .k{color:var(--text-onpaper-muted);}
  .ticket-row .v{font-weight:600;}
  .ticket-note{
    margin-top:16px;
    font-size:12.5px;
    color:#7A6672;
    background:var(--paper-dim);
    padding:12px 14px;
    border-radius:5px;
    line-height:1.5;
  }
  .ticket-items-title{
    font-size:12.5px;
    font-weight:700;
    color:#5c1738;
    margin:18px 0 10px;
    padding-top:16px;
    border-top:1px dashed var(--paper-line);
  }

  /* ---------- Admin passcode gate ---------- */
  .gate-wrap{
    max-width:380px;
    margin:60px auto 0;
  }
  .gate-wrap .card-paper{text-align:center;}
  .gate-icon{
    width:46px;height:46px;
    margin:0 auto 14px;
    border-radius:50%;
    background:var(--paper-dim);
    display:flex;align-items:center;justify-content:center;
    color:var(--amber-deep);
  }
  .gate-error{
    color:var(--rose);
    font-size:13px;
    margin-top:8px;
    min-height:16px;
  }

  /* ---------- Admin ---------- */
  .admin-grid{
    display:grid;
    grid-template-columns:220px 1fr;
    gap:24px;
  }
  @media (max-width:820px){
    .admin-grid{grid-template-columns:1fr;}
  }
  .date-rail{
    background:rgba(250,243,246,0.06);
    border-radius:8px;
    padding:14px;
  }
  .date-rail .rail-title{
    font-size:12px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--text-muted);
    padding:4px 8px 12px;
  }
  .rail-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:11px 12px;
    border-radius:6px;
    cursor:pointer;
    font-size:14px;
    margin-bottom:4px;
    color:var(--text-onink);
  }
  .rail-item:hover{background:rgba(250,243,246,0.08);}
  .rail-item.active{background:var(--amber);color:#fff;font-weight:700;}
  .rail-item .count{
    font-family:'Space Mono',monospace;
    font-size:12px;
    opacity:0.85;
  }

  .admin-main{
    background:rgba(250,243,246,0.06);
    border-radius:8px;
    padding:18px;
  }
  .admin-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .search-box{
    flex:1;
    min-width:180px;
    display:flex;
    align-items:center;
    gap:8px;
    background:rgba(250,243,246,0.08);
    border-radius:6px;
    padding:9px 13px;
  }
  .search-box input{
    background:transparent;
    border:none;
    color:var(--text-onink);
    font-family:'Kanit',sans-serif;
    font-size:14px;
    width:100%;
    outline:none;
  }
  .search-box input::placeholder{color:var(--text-muted);}
  .search-box svg{flex-shrink:0;opacity:0.6;}

  table{
    width:100%;
    border-collapse:collapse;
    font-size:13.5px;
  }
  thead th{
    text-align:left;
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--text-muted);
    padding:8px 10px;
    border-bottom:1px solid rgba(250,243,246,0.15);
  }
  tbody td{
    padding:12px 10px;
    border-bottom:1px solid rgba(250,243,246,0.08);
    vertical-align:middle;
  }
  tbody tr:hover{background:rgba(250,243,246,0.04);}
  .cust-name{font-weight:600;}
  .cust-sub{font-size:12px;color:var(--text-muted);}
  .receipt-chip{
    display:inline-block;
    font-family:'Space Mono',monospace;
    font-size:11.5px;
    background:rgba(255,62,147,0.16);
    color:var(--amber);
    padding:3px 8px;
    border-radius:4px;
    margin:2px 3px 2px 0;
  }
  .queue-tag{
    font-family:'Space Mono',monospace;
    font-weight:700;
    color:var(--amber);
  }
  .calling-badge{
    display:inline-block;
    margin-left:6px;
    font-size:11px;
    font-weight:700;
    color:var(--ok);
    background:rgba(79,174,134,0.15);
    padding:2px 8px;
    border-radius:999px;
    white-space:nowrap;
  }
  .status-btn{
    border:none;
    border-radius:999px;
    padding:6px 13px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    font-family:'Kanit',sans-serif;
  }
  .status-btn.pending{background:rgba(255,62,147,0.18);color:var(--amber);}
  .status-btn.done{background:rgba(79,174,134,0.22);color:var(--ok);}
  .status-btn.cancelled{background:rgba(226,73,107,0.22);color:var(--rose);}

  .empty-row{
    text-align:center;
    padding:32px;
    color:var(--text-muted);
    font-size:14px;
  }

  /* Add customer modal */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,0.6);
    display:flex;align-items:center;justify-content:center;
    padding:20px;
    z-index:50;
  }
  .modal{
    background:var(--paper);
    color:var(--text-onpaper);
    border-radius:8px;
    padding:26px;
    max-width:440px;
    width:100%;
    max-height:88vh;
    overflow-y:auto;
    border-top:3px solid var(--amber);
  }
  .modal h3{font-family:'Kanit',sans-serif;font-weight:700;color:var(--ink);margin:0 0 18px;font-size:19px;}
  select{
    width:100%;
    padding:10px 12px;
    border:1.5px solid var(--paper-line);
    border-radius:5px;
    background:#fff;
    font-family:'Kanit',sans-serif;
    font-size:14px;
    color:var(--text-onpaper);
  }
  .receipt-row{display:flex;gap:8px;margin-bottom:8px;}
  .receipt-row input{flex:1;}
  .icon-btn{
    border:none;background:var(--paper-dim);border-radius:5px;
    width:38px;flex-shrink:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    color:var(--rose);
  }
  .add-receipt-btn{
    background:none;border:1px dashed var(--paper-line);
    border-radius:5px;padding:8px;width:100%;
    color:#5c1738;font-size:13px;cursor:pointer;
    font-family:'Kanit',sans-serif;
    margin-bottom:16px;
  }
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;}

  /* ---------- Line items (receipt entry) ---------- */
  .item-card{
    border:1.5px solid var(--paper-line);
    border-radius:7px;
    padding:13px 14px;
    margin-bottom:10px;
    background:#fffafd;
  }
  .item-card-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
  }
  .item-card-top span{font-size:12px;font-weight:700;color:#5c1738;}
  .item-field-row{display:flex;gap:8px;margin-bottom:8px;}
  .item-field-row input{flex:1;min-width:0;}
  .item-field-row input.qty-input{flex:0 0 60px;}
  .item-field-row input.price-input{flex:0 0 90px;}
  .size-chip-group{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:2px;}
  .size-chip{
    border:1.5px solid var(--paper-line);
    background:#fff;
    border-radius:5px;
    padding:5px 12px;
    font-size:12.5px;
    font-family:'Kanit',sans-serif;
    cursor:pointer;
    color:var(--text-onpaper-muted);
  }
  .size-chip.selected{
    border-color:var(--amber-deep);
    background:var(--amber);
    color:#fff;
    font-weight:600;
  }
  .item-subtotal{
    text-align:right;
    font-size:12px;
    color:var(--text-onpaper-muted);
    margin-top:6px;
  }
  .receipt-total-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--paper-dim);
    border-radius:6px;
    padding:11px 14px;
    margin:14px 0 18px;
    font-weight:700;
    color:#5c1738;
  }
  .studentid-match-note{
    font-size:12px;
    background:rgba(79,174,134,0.15);
    color:var(--ok);
    padding:8px 11px;
    border-radius:5px;
    margin:-6px 0 14px;
  }

  /* ---------- Customer detail modal ---------- */
  .detail-modal{max-width:560px;}
  .detail-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:18px;
    padding-bottom:16px;
    border-bottom:1px solid var(--paper-dim);
  }
  .detail-head .dh-name{font-size:18px;font-weight:700;color:var(--ink);}
  .detail-head .dh-sub{font-size:12.5px;color:var(--text-onpaper-muted);margin-top:3px;line-height:1.6;}
  .receipt-detail-card{
    border:1.5px solid var(--paper-line);
    border-radius:8px;
    margin-bottom:14px;
    overflow:hidden;
  }
  .receipt-detail-card .rdc-head{
    background:var(--paper-dim);
    padding:9px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .receipt-detail-card .rdc-head .rno{
    font-family:'Space Mono',monospace;
    font-weight:700;
    color:var(--amber-deep);
    font-size:13.5px;
  }
  .receipt-detail-card .rdc-head .rsub{font-size:11px;color:var(--text-onpaper-muted);}
  .item-line{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:9px 14px;
    border-bottom:1px solid #f2eef1;
    font-size:13.5px;
  }
  .item-line:last-child{border-bottom:none;}
  .item-line .il-name{font-weight:600;}
  .item-line .il-meta{font-size:11.5px;color:var(--text-onpaper-muted);margin-top:2px;}
  .item-line .il-price{font-family:'Space Mono',monospace;font-weight:700;white-space:nowrap;}
  .rdc-subtotal{
    padding:9px 14px;
    text-align:right;
    font-size:12.5px;
    font-weight:700;
    color:#5c1738;
    background:#fdfaf9;
  }
  .grand-total-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--ink);
    color:#fff;
    border-radius:7px;
    padding:13px 16px;
    margin-top:6px;
    font-weight:700;
  }
  .grand-total-row .gt-amt{font-family:'Space Mono',monospace;color:var(--amber);font-size:16px;}
  .view-btn{
    border:none;
    background:rgba(255,62,147,0.15);
    color:var(--amber);
    border-radius:6px;
    padding:7px 12px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    font-family:'Kanit',sans-serif;
    white-space:nowrap;
  }

  .top-note{
    font-size:12px;color:var(--text-muted);margin-top:10px;
  }
  .fab-add{
    display:flex;align-items:center;gap:6px;
    white-space:nowrap;
  }
  .gate-logout{
    font-size:12px;color:var(--text-muted);cursor:pointer;text-decoration:underline;
    background:none;border:none;font-family:'Kanit',sans-serif;
  }

  /* ---------- Admin sub-tabs & registry ---------- */
  .booking-status-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    background:rgba(250,243,246,0.06);
    border-radius:8px;
    padding:12px 16px;
    margin-bottom:14px;
    font-size:13.5px;
  }
  .booking-status-bar .status-open{color:var(--ok);}
  .booking-status-bar .status-closed{color:var(--rose);}
  .schedule-close-panel{
    background:rgba(250,243,246,0.06);
    border-radius:8px;
    padding:12px 16px;
    margin-bottom:14px;
    font-size:13px;
  }
  .scp-label{ font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--text-muted); margin-bottom:8px; }
  .scp-current{ font-size:13px; color:var(--amber); margin-bottom:10px; font-weight:600; }
  .scp-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .scp-row input[type=datetime-local]{
    padding:8px 10px;
    border:1.5px solid rgba(250,243,246,0.15);
    background:rgba(250,243,246,0.05);
    color:var(--text-onink);
    border-radius:5px;
    font-family:'Kanit',sans-serif;
    font-size:13px;
  }
  .prep-total-banner{
    background:var(--paper-dim);
    color:#5c1738;
    font-weight:700;
    text-align:center;
    padding:12px 14px;
    border-radius:7px;
    margin-bottom:16px;
    font-size:14px;
  }
  .prep-subtotal-row td{
    background:var(--paper-dim);
    font-weight:700;
    color:#5c1738;
    font-size:12.5px;
  }
  .now-serving-panel{
    background:var(--ink);
    border-radius:8px;
    padding:16px 20px;
    margin-bottom:16px;
    color:#fff;
  }
  .now-serving-panel.ns-empty{
    text-align:center;
    color:var(--text-muted);
    font-size:13px;
    padding:14px;
  }
  .ns-title{font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-muted); margin-bottom:10px;}
  .ns-row{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;}
  .ns-current{display:flex; align-items:baseline; gap:10px;}
  .ns-label{font-size:13px; color:var(--text-muted);}
  .ns-number{font-size:32px; font-weight:700; color:var(--amber);}
  .ns-controls{display:flex; gap:8px;}
  .ns-hint{font-size:11.5px; color:var(--text-muted); margin-top:10px; line-height:1.5;}
  .now-serving-panel.dual{ background:var(--ink); }
  .dual-counter-row{ display:flex; gap:14px; flex-wrap:wrap; }
  .counter-cell{
    flex:1; min-width:160px;
    background:rgba(250,243,246,0.06);
    border-radius:8px;
    padding:14px 16px;
    text-align:center;
  }
  .cc-label{ font-size:12px; color:var(--text-muted); margin-bottom:6px; }
  .cc-number{ font-size:28px; font-weight:700; color:var(--amber); margin-bottom:10px; }
  .cc-controls{ display:flex; gap:6px; justify-content:center; }
  .btn-xs{ padding:6px 10px; font-size:12px; }

  /* ---------- Role select ---------- */
  .role-btn-group{ display:flex; flex-direction:column; gap:10px; margin-top:6px; }
  .role-btn{
    border:1.5px solid var(--paper-line);
    background:#fff;
    color:var(--ink);
    border-radius:8px;
    padding:16px;
    font-family:'Kanit',sans-serif;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
  }
  .role-btn:hover{ border-color:var(--amber-deep); background:var(--paper-dim); }
  .role-btn-overview{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .role-btn-overview:hover{ background:#000; }

  /* ---------- Counter view ---------- */
  .counter-header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:16px; flex-wrap:wrap; gap:10px;
  }
  .counter-role-badge{
    background:var(--amber); color:#fff;
    font-weight:700; font-size:13px;
    padding:6px 16px; border-radius:999px;
  }
  .date-pills-row{ display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .date-pill-btn{
    border:1.5px solid rgba(250,243,246,0.15);
    background:rgba(250,243,246,0.05);
    color:var(--text-muted);
    padding:8px 16px;
    border-radius:999px;
    font-family:'Kanit',sans-serif;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .date-pill-btn.active{ background:var(--amber); border-color:var(--amber); color:#fff; }
  .counter-main-panel{
    background:var(--ink);
    border-radius:10px;
    padding:32px 20px;
    text-align:center;
    max-width:420px;
    margin:0 auto;
  }
  .cmp-label{ font-size:13px; color:var(--text-muted); margin-bottom:8px; }
  .cmp-number{ font-size:64px; font-weight:700; color:var(--amber); margin-bottom:18px; }
  .cmp-controls{ display:flex; gap:10px; justify-content:center; }
  .other-counter-note{
    text-align:center;
    margin-top:16px;
    font-size:13.5px;
    color:var(--text-onink);
  }
  .admin-subtabs{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }  .subtab-btn{
    border:1.5px solid rgba(250,243,246,0.15);
    background:rgba(250,243,246,0.05);
    color:var(--text-muted);
    padding:9px 16px;
    border-radius:999px;
    font-family:'Kanit',sans-serif;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
  }
  .subtab-btn.active{
    background:var(--amber);
    border-color:var(--amber);
    color:#fff;
  }
  .booked-badge{
    display:inline-block;
    font-size:11.5px;
    font-weight:600;
    padding:4px 9px;
    border-radius:999px;
    white-space:nowrap;
  }
  .booked-badge.yes{background:rgba(79,174,134,0.2);color:var(--ok);}
  .booked-badge.no{background:rgba(250,243,246,0.1);color:var(--text-muted);}
  .booked-badge.cancelled{background:rgba(226,73,107,0.2);color:var(--rose);}
</style>
</head>

let customers = [];        // admin-side unified view: {studentId,name,phone,receipts,dateId,queue,status}
let customersCache = {};   // studentId -> {name, phone, receipts}  (จาก collection "customers")
let bookingsCache = {};    // studentId -> {dateId, queue, status, name, phone} (จาก collection "bookings")
let counterCache = {};     // dateId -> {count, nowServing} (จาก collection "queueCounters", อ่านได้แม้ไม่ล็อกอิน)

function rebuildCustomers(){
  const merged = {};
  for (const sid in customersCache){
    merged[sid] = { studentId: sid, name: customersCache[sid].name, phone: customersCache[sid].phone,
                     receipts: customersCache[sid].receipts || [], dateId: null, queue: null, status: null };
  }
  for (const sid in bookingsCache){
    const b = bookingsCache[sid];
    if(!merged[sid]) merged[sid] = { studentId: sid, name: b.name, phone: b.phone, receipts: [], dateId: null, queue: null, status: null };
    merged[sid].dateId = b.dateId;
    merged[sid].queue = b.queue;
    merged[sid].status = b.status;
  }
  customers = Object.values(merged);
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function receiptTotal(receipt){
  return receipt.items.reduce((sum,it)=> sum + (Number(it.qty)||0)*(Number(it.price)||0), 0);
}
function customerTotal(c){
  return c.receipts.reduce((sum,r)=> sum + receiptTotal(r), 0);
}
function fmtBaht(n){
  return Number(n||0).toLocaleString('th-TH') + (lang==='en' ? ' THB' : ' บาท');
}
function dateLabel(dateId){
  const d = PICKUP_DATES.find(p=>p.id===dateId);
  if(!d) return '-';
  return lang==='en' ? `${d.labelEn} (${d.weekdayEn})` : `${d.labelTh} (${d.weekdayTh})`;
}
function queueCountFor(dateId){
  return customers.filter(c=>c.dateId===dateId && c.status!=='cancelled').length;
}
function remainingForDate(dateId){
  const d = PICKUP_DATES.find(p=>p.id===dateId);
  const used = (counterCache[dateId] && counterCache[dateId].count) || 0;
  return d ? d.cap - used : 0;
}
function usedForDate(dateId){
  return (counterCache[dateId] && counterCache[dateId].count) || 0;
}
function counterServingForDate(dateId, counterKey){
  return (counterCache[dateId] && counterCache[dateId][counterKey]) || 0;
}
function combinedServingForDate(dateId){
  const d = counterCache[dateId] || {};
  return Math.max(d.counter1Serving || 0, d.counter2Serving || 0);

function isDateBookingClosed(dateId){

function statusLabel(status){

}
async function toggleBookingStatus(sid, btnEl){

    // ถ้าเดิมเป็น cancelled การกดยืนยันตรงนี้จะลบสถานะยกเลิกออกไปในตัว)

/* ============================================================================
   bookPickupSlot — Firestore transaction: การันตีไม่มี 2 คนได้คิวเดียวกัน
   ในวันเดียวกันเด็ดขาด แม้กดพร้อมกันเป็นร้อยคน
   ============================================================================ */
/* ============================================================================
   BookingBusinessError — ข้อผิดพลาดที่เกิดจากตรรกะทางธุรกิจ (จองไปแล้ว,
   ปิดรับจองวันนี้, คิวหมด) ต่างจาก error ทางเทคนิค (เน็ตหลุด, contention
   ตอนคนจองพร้อมกันจำนวนมาก) — แยกไว้เพื่อรู้ว่า error แบบไหนควร "retry
   ให้อัตโนมัติ" (ทางเทคนิค) กับแบบไหนควร "แจ้งแล้วจบเลย" (ทางธุรกิจ)
   ============================================================================ */
class BookingBusinessError extends Error {}

/* ============================================================================
   bookPickupSlot — Firestore transaction: การันตีไม่มี 2 คนได้คิวเดียวกัน
   ในวันเดียวกันเด็ดขาด แม้กดพร้อมกันเป็นร้อยคน (ดูรายละเอียดกลไกใน
   booking-service.js ที่เคยส่งให้ก่อนหน้านี้ — โค้ดจริงอยู่ตรงนี้แล้ว)

   รองรับกรณี "จองซ้อนทับคิวที่ถูกยกเลิกไปแล้ว" ด้วย: ถ้า booking เดิม
   ของรหัสนักศึกษานี้มีสถานะ cancelled อยู่ ถือว่าจองใหม่ทับได้เลย
   (ไม่ต้องลบ document เดิมออกก่อน)
   ============================================================================ */
async function bookPickupSlot({ dateId, studentId, name, phone }){
  const counterRef = doc(db, "queueCounters", dateId);
  const bookingRef = doc(db, "bookings", studentId);

  return await runTransaction(db, async (tx) => {
    const [bookingSnap, counterSnap] = await Promise.all([tx.get(bookingRef), tx.get(counterRef)]);

    if (bookingSnap.exists() && bookingSnap.data().status !== 'cancelled'){
      const existing = bookingSnap.data();
      throw new BookingBusinessError(t('already_booked')(dateLabel(existing.dateId), String(existing.queue).padStart(3,'0')));
    }

    if (counterSnap.exists() && counterSnap.data().bookingClosed){
      throw new BookingBusinessError(t('date_closed_error'));
    }

    const currentCount = counterSnap.exists() ? counterSnap.data().count : 0;
    const nextQueue = currentCount + 1;

    tx.set(counterRef, { count: nextQueue }, { merge: true });
    tx.set(bookingRef, {
      studentId, name, phone, dateId,
      queue: nextQueue,
      status: "pending",
      bookedAt: serverTimestamp(),
    });

    return nextQueue;
  });
}

/* ============================================================================
   bookPickupSlotWithRetry — ชั้นป้องกันเพิ่มเติมสำหรับวันจริงที่อาจมีคน
   เข้าเว็บพร้อมกันหลายร้อยคน (500-600 คน) กดจองพร้อมกันในเวลาไล่เลี่ยกัน
   ------------------------------------------------------------------------
   Firestore transaction ที่ใช้ใน bookPickupSlot() การันตีความถูกต้อง
   (ไม่มีทางได้เลขคิวซ้ำ) อยู่แล้วในตัว แม้จะมีคนกดพร้อมกันเป็นร้อยคน — แต่
   ถ้าคนกดพร้อมกันเยอะมากๆในวินาทีเดียวกัน อาจมีบางคำขอ "ชนกัน" ต้อง
   ลองใหม่ (Firestore SDK มี retry อัตโนมัติในตัวอยู่แล้วระดับหนึ่ง) ฟังก์ชัน
   นี้เพิ่มการ retry อีกชั้นแบบ exponential backoff (รอนานขึ้นทีละรอบ)
   เฉพาะ error ที่เป็นปัญหาทางเทคนิค/ชนกันชั่วคราวเท่านั้น — ถ้า error เป็น
   เรื่องทางธุรกิจจริงๆ (จองไปแล้ว, ปิดรับจอง) จะไม่ retry แต่แจ้งทันที
   ============================================================================ */
async function bookPickupSlotWithRetry(params, maxAttempts=4){
  let lastErr;
  for(let attempt=0; attempt<maxAttempts; attempt++){
    try{
      return await bookPickupSlot(params);
    }catch(e){
      if(e instanceof BookingBusinessError) throw e;
      lastErr = e;
      if(attempt < maxAttempts-1){
        await new Promise(r=>setTimeout(r, 300 * Math.pow(2, attempt))); // 300ms, 600ms, 1200ms
      }
    }
  }
  throw lastErr;
}

/* ============================================================================
   callNextAtCounter / callPrevAtCounter — เรียกคิวถัดไป/ก่อนหน้า แยกตาม
   เคาน์เตอร์ ใช้ transaction กันไม่ให้เคาน์เตอร์ 1 กับ 2 เผลอเรียกเลข
   เดียวกันพร้อมกัน (ดึงจาก "nextToCall" ซึ่งเป็นคิวกลางที่ใช้ร่วมกัน)
   ============================================================================ */
async function callNextAtCounter(dateId, counterKey){
  const counterRef = doc(db, 'queueCounters', dateId);
  return await runTransaction(db, async (tx) => {
    const snap = await tx.get(counterRef);
    const data = snap.exists() ? snap.data() : { count:0, nextToCall:0 };
    const issued = data.count || 0;
    const nextToCall = data.nextToCall || 0;
    if(nextToCall >= issued){
      throw new Error(t('no_more_to_call'));
    }
    const newNumber = nextToCall + 1;
    const update = { nextToCall: newNumber };
    update[counterKey] = newNumber;
    tx.set(counterRef, update, { merge: true });
    return newNumber;
  });
}

async function callPrevAtCounter(dateId, counterKey){
  const counterRef = doc(db, 'queueCounters', dateId);
  return await runTransaction(db, async (tx) => {
    const snap = await tx.get(counterRef);
    const data = snap.exists() ? snap.data() : {};
    const current = data[counterKey] || 0;
    if(current <= 0) return current;
    const newNumber = current - 1;
    const update = {};
    update[counterKey] = newNumber;
    // ถ้าเลขนี้เป็นเลขล่าสุดที่แจกไปจาก "คิวกลาง" (ยังไม่มีใครเรียกทับ)
    // ให้ดึง nextToCall กลับด้วย กันไม่ให้เลขนี้หายไปจากระบบเฉยๆ
    if((data.nextToCall || 0) === current){
      update.nextToCall = newNumber;
    }
    tx.set(counterRef, update, { merge: true });
    return newNumber;
  });
}

function attachCustomerHandlers(){

  if(btn1){

      const name = document.getElementById('inpName').value.trim();

      if(!name || !sid || !phone){
        alert(t('alert_fill_all'));
        return;
      }
      btn1.disabled = true;
      btn1.textContent = t('checking');
      try{
        const snap = await getDoc(doc(db, 'customers', sid));
        if(!snap.exists()){
          alert(t('alert_not_found'));
          return;
        }
        const record = snap.data();
        if(normalizeName(record.name) !== normalizeName(name)){
          alert(t('alert_name_mismatch'));
          return;
        }
        form.name = name; form.studentId = sid; form.phone = phone; form.receipts = record.receipts || [];

        // เช็คว่าคนนี้เคยจองคิวไปแล้วจากเครื่อง/อุปกรณ์อื่นหรือยัง ถ้าเคย
        // ให้ดึงใบคิวเดิมมาโชว์เลย ไม่ต้องให้จองซ้ำ (ทำให้เช็คคิวได้จาก
        // อุปกรณ์ไหนก็ได้ ไม่ใช่แค่เครื่องที่จองตอนแรก)
        const bookingSnap = await getDoc(doc(db, 'bookings', sid));
        if(bookingSnap.exists() && bookingSnap.data().status !== 'cancelled'){
          const b = bookingSnap.data();
          form.dateId = b.dateId;
          form.queue = b.queue;
          step = 3;
          saveTicketToStorage();
          renderCustomer();
          return;
        }

        step = 2;
        renderCustomer();
      }catch(e){
        console.error(e);
        alert(t('alert_connection_error'));
      }finally{
        if(document.getElementById('btnStep1Next')){
          btn1.disabled = false;
          btn1.textContent = t('btn_next');
        }
      }
    };
  }
  document.querySelectorAll('.date-opt').forEach(opt=>{
    opt.onclick = () => { form.dateId = opt.getAttribute('data-date'); renderCustomer(); };
  });
  const back2 = document.getElementById('btnStep2Back');
  if(back2) back2.onclick = () => { step = 1; renderCustomer(); };
  const next2 = document.getElementById('btnStep2Next');
  if(next2){
    next2.onclick = async () => {
      if(!form.dateId) return;
      next2.disabled = true;
      next2.textContent = t('booking');
      try{
        const queue = await bookPickupSlotWithRetry({ dateId: form.dateId, studentId: form.studentId, name: form.name, phone: form.phone });
        form.queue = queue;
        step = 3;
        saveTicketToStorage();
        renderCustomer();
      }catch(e){
        alert(e.message || t('alert_booking_failed'));
        if(document.getElementById('btnStep2Next')){
          next2.disabled = false;
          next2.textContent = t('btn_getqueue');
        }
      }
    };
  }
  const toggleItemsBtn = document.getElementById('btnToggleItems');
  if(toggleItemsBtn){
    toggleItemsBtn.onclick = () => { ticketShowItems = !ticketShowItems; renderCustomer(); };
  }
  const toggleQueueBtn = document.getElementById('btnToggleQueueCheck');
  if(toggleQueueBtn){
    toggleQueueBtn.onclick = () => { ticketShowQueueCheck = !ticketShowQueueCheck; renderCustomer(); };
  }
  const cancelBtn = document.getElementById('btnCancelQueue');
  if(cancelBtn){
    cancelBtn.onclick = async () => {
      if(!confirm(t('confirm_cancel_queue'))) return;
      cancelBtn.disabled = true;
      cancelBtn.textContent = t('cancelling');
      try{
        await updateDoc(doc(db, 'bookings', form.studentId), { status: 'cancelled' });
        clearTicketFromStorage();
        ticketShowItems = false;
        ticketShowQueueCheck = false;
        form = { name:'', studentId:'', phone:'', dateId:null, queue:null, receipts:[] };
        step = 1;
        renderCustomer();
      }catch(e){
        alert(t('cancel_failed') + (e.message||''));
        if(document.getElementById('btnCancelQueue')){
          cancelBtn.disabled = false;
          cancelBtn.textContent = t('btn_cancel_queue');
        }
      }
    };
  }
}

/* ---------------- Prep summary (สรุปสินค้าที่ต้องเตรียม) ---------------- */
function computePrepSummary(dateId){
  const groups = {}; // "product|||note" -> { product, note, total, bySize: {size: qty} }
  let totalItems = 0;
  let orderCount = 0;
  customers.filter(c=>c.dateId===dateId && c.status!=='cancelled').forEach(c=>{
    orderCount++;
    c.receipts.forEach(r=>{
      r.items.forEach(it=>{
        const noteKey = it.note ? it.note.trim() : '';
        const groupKey = it.product + '|||' + noteKey;
        if(!groups[groupKey]) groups[groupKey] = { product: it.product, note: noteKey, total:0, bySize:{} };
        groups[groupKey].total += it.qty;
        const sizeKey = it.size || '-';
        groups[groupKey].bySize[sizeKey] = (groups[groupKey].bySize[sizeKey]||0) + it.qty;
        totalItems += it.qty;
      });
    });
  });
  return { groups, totalItems, orderCount };
}

function openPrepSummaryModal(dateId){
  const { groups, totalItems, orderCount } = computePrepSummary(dateId);
  const byProduct = {};
  Object.values(groups).forEach(g=>{
    if(!byProduct[g.product]) byProduct[g.product] = [];
    byProduct[g.product].push(g);
  });
  const productNames = Object.keys(byProduct).sort();
  const root = document.getElementById('modalRoot');

  let rowsHtml = '';
  if(productNames.length){
    productNames.forEach(p=>{
      const noteGroups = byProduct[p].sort((a,b)=> (a.note||'').localeCompare(b.note||''));
      const productTotal = noteGroups.reduce((s,g)=>s+g.total,0);
      noteGroups.forEach(g=>{
        const sizeBreakdown = Object.keys(g.bySize).sort().map(sz=>`${sz==='-'?'':sz+': '}${g.bySize[sz]}`).join(' · ');
        const label = g.note ? `${escapeHtml(productName(p))} — <span style="color:var(--amber-deep);">${escapeHtml(g.note)}</span>` : escapeHtml(productName(p));
        rowsHtml += `
          <tr>
            <td>${label}</td>
            <td class="mono" style="font-size:12.5px;">${escapeHtml(sizeBreakdown)}</td>
            <td class="mono" style="text-align:right;font-weight:700;">${g.total}</td>
          </tr>`;
      });
      if(noteGroups.length > 1){
        rowsHtml += `
          <tr class="prep-subtotal-row">
            <td colspan="2">${t('prep_subtotal_label')(escapeHtml(productName(p)))}</td>
            <td class="mono" style="text-align:right;font-weight:700;">${productTotal}</td>
          </tr>`;
      }
    });
  } else {
    rowsHtml = `<tr><td colspan="3" class="empty-row">${t('prep_empty')}</td></tr>`;
  }

  root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal detail-modal" id="modalBox">
        <h3>${t('prep_summary_title')(dateLabel(dateId))}</h3>
        <div class="prep-total-banner">${t('prep_total_label')(totalItems, orderCount)}</div>
        <table>
          <thead>
            <tr><th>${t('th_product')}</th><th>${t('th_size_breakdown')}</th><th style="text-align:right;">${t('th_prep_total')}</th></tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="btnCloseDetail">${t('btn_close')}</button>

  document.getElementById('modalOverlay').onclick = (e) => { if(e.target.id==='modalOverlay') closeModal(); };

}

/* ---------------- Add receipt modal ---------------- */
let modalItems = [{ product:'', size:'', qty:1, price:'', note:'' }];

function openReceiptModal(){
  modalItems = [{ product:'', size:'', qty:1, price:'', note:'' }];
  renderReceiptModal();
}

function receiptModalSubtotal(){
  return modalItems.reduce((s,it)=> s + (Number(it.qty)||0)*(Number(it.price)||0), 0);
}

function renderReceiptModal(prefill){
  prefill = prefill || {};
  const root = document.getElementById('modalRoot');
  const matched = prefill.studentId ? findCustomerByStudentId(prefill.studentId) : null;

  root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal" id="modalBox">
        <h3>${t('modal_title')}</h3>
        <div class="field">
          <label>${t('label_receiptno')}</label>
          <input type="text" id="mReceiptNo" placeholder="${t('ph_receiptno')}" value="${escapeHtml(prefill.receiptNo||'')}">
        </div>
        <div class="field">
          <label>${t('label_studentid')}</label>
          <input type="text" id="mStudentId" placeholder="${t('ph_studentid_receipt')}" value="${escapeHtml(prefill.studentId||'')}">
        </div>
        ${matched ? `<div class="studentid-match-note">${t('match_note')(escapeHtml(matched.name))}</div>` : ''}
        ${!matched ? `
        <div class="field">
          <label>${t('label_name')}</label>
          <input type="text" id="mName" placeholder="${t('ph_name_receipt')}" value="${escapeHtml(prefill.name||'')}">
        </div>
        <div class="field">
          <label>${t('label_phone')}</label>
          <input type="tel" id="mPhone" placeholder="${t('ph_phone_receipt')}" value="${escapeHtml(prefill.phone||'')}">
        </div>
        <div class="field">
          <label>${t('label_pickupdate')}</label>
          <select id="mDate">
            ${PICKUP_DATES.map(d=>`<option value="${d.id}" ${prefill.dateId===d.id?'selected':''}>${lang==='en'?d.labelEn:d.labelTh} (${lang==='en'?d.weekdayEn:d.weekdayTh})</option>`).join('')}
          </select>
        </div>` : ''}

        <div class="field">
          <label>${t('label_items')}</label>
          <div id="itemRows">
            ${modalItems.map((it,i)=>`
              <div class="item-card">
                <div class="item-card-top">
                  <span>${t('item_n')(i+1)}</span>
                  ${modalItems.length>1?`<button class="icon-btn" data-remove-item="${i}">✕</button>`:''}
                </div>
                <div class="item-field-row">
                  <input type="text" class="itemProduct" data-idx="${i}" placeholder="${t('ph_product')}" value="${escapeHtml(it.product)}">
                </div>
                <div class="size-chip-group">
                  ${PRODUCT_SIZES.map(sz=>`<button type="button" class="size-chip ${it.size===sz?'selected':''}" data-size-idx="${i}" data-size-val="${sz}">${sz}</button>`).join('')}
                </div>
                <div class="item-field-row" style="margin-top:8px;">
                  <input type="number" min="1" class="itemQty qty-input" data-idx="${i}" placeholder="${t('ph_qty')}" value="${it.qty}">
                  <input type="number" min="0" class="itemPrice price-input" data-idx="${i}" placeholder="${t('ph_price')}" value="${escapeHtml(String(it.price))}">
                </div>
                <div class="item-field-row" style="margin-top:8px;">
                  <input type="text" class="itemNote" data-idx="${i}" placeholder="${t('ph_note')}" value="${escapeHtml(it.note||'')}">
                </div>
              </div>
            `).join('')}
          </div>
          <button class="add-receipt-btn" id="btnAddItemRow">${t('btn_add_item')}</button>
        </div>

        <div class="receipt-total-row">
          <span>${t('receipt_total_label')}</span>
          <span class="mono">${fmtBaht(receiptModalSubtotal())}</span>
        </div>

        <div class="modal-actions">
          <button class="btn btn-ghost" id="btnCancelModal">${t('btn_cancel')}</button>
          <button class="btn btn-primary" id="btnSaveModal">${t('btn_save_receipt')}</button>
        </div>
      </div>
    </div>`;

  document.getElementById('modalOverlay').onclick = (e) => { if(e.target.id==='modalOverlay') closeModal(); };
  document.getElementById('btnCancelModal').onclick = closeModal;

  const sidInput = document.getElementById('mStudentId');
  sidInput.oninput = () => {
    syncItemsFromDom();
    renderReceiptModal({
      receiptNo: document.getElementById('mReceiptNo').value,
      studentId: sidInput.value,
      name: document.getElementById('mName') ? document.getElementById('mName').value : '',
      phone: document.getElementById('mPhone') ? document.getElementById('mPhone').value : '',
      dateId: document.getElementById('mDate') ? document.getElementById('mDate').value : null
    });
    document.getElementById('mStudentId').focus();
    const v = document.getElementById('mStudentId').value;
    document.getElementById('mStudentId').setSelectionRange(v.length, v.length);
  };

  document.getElementById('btnAddItemRow').onclick = () => {
    syncItemsFromDom();
    modalItems.push({ product:'', size:'', qty:1, price:'', note:'' });
    renderReceiptModal(currentPrefillFromDom());
  };
  document.querySelectorAll('[data-remove-item]').forEach(b=>{
    b.onclick = () => {
      syncItemsFromDom();
      const idx = Number(b.getAttribute('data-remove-item'));
      modalItems.splice(idx,1);
      renderReceiptModal(currentPrefillFromDom());
    };
  });
  document.querySelectorAll('[data-size-idx]').forEach(b=>{
    b.onclick = () => {
      syncItemsFromDom();
      const idx = Number(b.getAttribute('data-size-idx'));
      modalItems[idx].size = b.getAttribute('data-size-val');
      renderReceiptModal(currentPrefillFromDom());
    };
  });

  document.getElementById('btnSaveModal').onclick = async () => {
    syncItemsFromDom();
    const receiptNo = document.getElementById('mReceiptNo').value.trim();
    const studentId = document.getElementById('mStudentId').value.trim();
    const existing = findCustomerByStudentId(studentId);
    const items = modalItems
      .map(it=>{
        const out = { product: it.product.trim(), size: it.size, qty: Number(it.qty)||1, price: Number(it.price)||0 };
        if(it.note && it.note.trim()) out.note = it.note.trim();
        return out;
      })
      .filter(it=>it.product);

    if(!receiptNo || !studentId || !items.length){
      alert(t('alert_fill_receipt'));
      return;
    }

    const saveBtn = document.getElementById('btnSaveModal');
    saveBtn.disabled = true;
    saveBtn.textContent = t('saving');
    try{
      const newReceipt = { no: receiptNo, items };
      if(existing){
        await updateDoc(doc(db, 'customers', studentId), { receipts: arrayUnion(newReceipt) });
      } else {
        const name = document.getElementById('mName').value.trim();
        const phone = document.getElementById('mPhone').value.trim();
        const dateId = document.getElementById('mDate').value;
        if(!name || !phone){
          alert(t('alert_fill_new_customer'));
          saveBtn.disabled = false;
          saveBtn.textContent = t('btn_save_receipt');
          return;
        }
        await setDoc(doc(db, 'customers', studentId), { name, phone, receipts: [newReceipt] });
        await bookPickupSlotWithRetry({ dateId, studentId, name, phone });
      }
      closeModal();
    }catch(e){
      alert(t('alert_save_failed') + (e.message||''));
      saveBtn.disabled = false;
      saveBtn.textContent = t('btn_save_receipt');
    }
  };
}

function currentPrefillFromDom(){
  return {
    receiptNo: document.getElementById('mReceiptNo') ? document.getElementById('mReceiptNo').value : '',
    studentId: document.getElementById('mStudentId') ? document.getElementById('mStudentId').value : '',
    name: document.getElementById('mName') ? document.getElementById('mName').value : '',
    phone: document.getElementById('mPhone') ? document.getElementById('mPhone').value : '',
    dateId: document.getElementById('mDate') ? document.getElementById('mDate').value : null
  };
}

function syncItemsFromDom(){
  document.querySelectorAll('.itemProduct').forEach(inp=>{
    const idx = Number(inp.getAttribute('data-idx'));
    if(modalItems[idx]) modalItems[idx].product = inp.value;
  });
  document.querySelectorAll('.itemQty').forEach(inp=>{
    const idx = Number(inp.getAttribute('data-idx'));
    if(modalItems[idx]) modalItems[idx].qty = inp.value;
  });
  document.querySelectorAll('.itemPrice').forEach(inp=>{
    const idx = Number(inp.getAttribute('data-idx'));
    if(modalItems[idx]) modalItems[idx].price = inp.value;
  });
  document.querySelectorAll('.itemNote').forEach(inp=>{
    const idx = Number(inp.getAttribute('data-idx'));
    if(modalItems[idx]) modalItems[idx].note = inp.value;
  });
}

/* ---------------- Firestore data loading ----------------
   queueCounters: แทนที่จะเปิด listener ทั้ง 3 วันค้างไว้ตลอดเวลา ให้เปิดเฉพาะวันที่
   "กำลังจำเป็นต้องใช้จริง" ตามสถานะหน้าจอปัจจุบัน:
     - โหมดลูกค้า ยังไม่เลือกวัน (step 1-2)  → ต้องเห็นทุกวัน (กำลังเทียบที่ว่าง)
     - โหมดลูกค้า เลือกวันแล้ว (step 3 รอคิว) → ต้องเห็นแค่วันที่ตัวเองจองเท่านั้น
     - โหมดแอดมิน                           → ต้องเห็นทุกวัน (ภาพรวม/สลับดูได้)
   ฟังก์ชัน syncQueueCounterListeners() จะถูกเรียกทุกครั้งที่ render เพื่อเปิด/ปิด
   listener ให้ตรงกับสถานะล่าสุดเสมอ ไม่เปิดเกินความจำเป็น
   ------------------------------------------------------------------ */
let dateListeners = {}; // dateId -> unsubscribe function สำหรับ listener ที่เปิดอยู่ตอนนี้

function neededQueueCounterDateIds(){
  if(mode==='admin') return PICKUP_DATES.map(d=>d.id);
  if(mode==='customer'){
    if(step<=2 || !form.dateId) return PICKUP_DATES.map(d=>d.id); // ยังเลือก/เทียบวันอยู่ ต้องเห็นทุกวัน
    return [form.dateId]; // เลือกแล้ว รอคิวอยู่ สนใจแค่วันตัวเอง
  }
  return PICKUP_DATES.map(d=>d.id);
}

function syncQueueCounterListeners(){
  const needed = new Set(neededQueueCounterDateIds());
  // ปิด listener ของวันที่ไม่จำเป็นแล้ว
  Object.keys(dateListeners).forEach(id=>{
    if(!needed.has(id)){ dateListeners[id](); delete dateListeners[id]; }
  });
  // เปิด listener ของวันที่จำเป็นแต่ยังไม่ได้เปิด
  needed.forEach(id=>{
    if(!dateListeners[id]){
      dateListeners[id] = onSnapshot(doc(db, 'queueCounters', id), (docSnap)=>{
        if(docSnap.exists()) counterCache[id] = docSnap.data();
        else delete counterCache[id];
        if(mode==='customer' && (step===2 || step===3)) renderCustomer();
        if(mode==='admin' && adminAuthed) renderAdmin();
      }, (err)=> console.error(`queueCounters/${id} listener error`, err));
    }
  });
}
syncQueueCounterListeners(); // เรียกครั้งแรกตอนโหลดหน้า

const ADMIN_DATA_COLLECTION_LIMIT = 2000;   // เพดานจำนวนเอกสารต่อครั้งที่อ่าน กันโควต้าพุ่งถ้าข้อมูลโตผิดปกติ
const ADMIN_REFRESH_INTERVAL_MS = 60000;    // รีเฟรชข้อมูล admin ทุก 60 วิ (เดิม 25 วิ) แทน realtime ตลอดเวลา

let adminRefreshTimer = null;

async function fetchAdminData(){
  try{
    // bookings: ถ้า admin กำลังดูวันใดวันหนึ่งอยู่ ดึงเฉพาะวันนั้นพอ ไม่ต้องดึงทุกวันทุกครั้ง
    const bookingsQuery = (adminSelectedDate === 'all')
      ? query(collection(db, 'bookings'), limit(ADMIN_DATA_COLLECTION_LIMIT))
      : query(collection(db, 'bookings'), where('dateId', '==', adminSelectedDate), limit(ADMIN_DATA_COLLECTION_LIMIT));

    const [customersSnap, bookingsSnap] = await Promise.all([
      getDocs(query(collection(db, 'customers'), limit(ADMIN_DATA_COLLECTION_LIMIT))),
      getDocs(bookingsQuery)
    ]);
    customersCache = {};
    customersSnap.forEach(d=> customersCache[d.id] = d.data());
    bookingsCache = {};
    bookingsSnap.forEach(d=> bookingsCache[d.id] = d.data());
    rebuildCustomers();
    if(mode==='admin') renderAdmin();
  }catch(err){
    console.error('fetchAdminData error', err);
  }
}

function startAdminDataPolling(){
  stopAdminDataPolling(); // กันไม่ให้มี interval ซ้อนกันถ้าเรียกซ้ำ
  fetchAdminData(); // โหลดทันทีตอน login/reload
  adminRefreshTimer = setInterval(()=>{
    if(document.hidden) return; // แท็บถูกซ่อน/สลับไปแท็บอื่น/minimize → ข้ามรอบนี้ ไม่อ่านข้อมูลทิ้งเปล่าๆ
    fetchAdminData();
  }, ADMIN_REFRESH_INTERVAL_MS);
}

// เมื่อสลับกลับมาที่แท็บนี้อีกครั้งหลังจากถูกซ่อนไว้ ให้ดึงข้อมูลใหม่ทันที 1 ครั้ง
// (ไม่ต้องรอครบรอบ 25 วิ) เพื่อให้ admin เห็นข้อมูลล่าสุดทันทีที่กลับมาดู
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && adminAuthed && adminRefreshTimer){
    fetchAdminData();
  }
});

function stopAdminDataPolling(){
  if(adminRefreshTimer){ clearInterval(adminRefreshTimer); adminRefreshTimer = null; }
}

// เรียกฟังก์ชันนี้เองได้ทันทีหลัง admin ทำ action ที่เปลี่ยนข้อมูล (เช่นกดยืนยัน/ยกเลิก)
// เพื่อให้เห็นผลทันทีโดยไม่ต้องรอรอบ poll ถัดไป — ไม่จำเป็นต้องแก้ตรงนี้เพิ่ม
// เพียงแค่เรียก fetchAdminData() หลัง action นั้นๆ ถ้าต้องการความไวขึ้น
window.__refreshAdminDataNow = fetchAdminData; // เผื่ออยากผูกกับปุ่ม Refresh เองภายหลัง

onAuthStateChanged(auth, (user)=>{
  adminAuthed = !!user;
  if(user){
    startAdminDataPolling();
  } else {
    stopAdminDataPolling();
    customersCache = {}; bookingsCache = {}; customers = [];
  }
  if(mode==='admin') renderAdmin();
});

/* ---------------- Init ---------------- */
(function initCustomerState(){
  const saved = loadTicketFromStorage();
  if(saved && saved.queue){
    form = saved;
    step = 3;
  }
})();
renderTopbarLabels();
setLang(lang); // sync toggle button highlight without re-triggering extra render churn
renderCustomer();
</script>
